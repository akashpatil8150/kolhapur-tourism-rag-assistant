<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Tourism AI</title>

    <link rel="stylesheet"
          href="/static/style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <div class="auth-card">

        <div class="logo">
            🧳
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">

            Join Tourism AI

        </p>

        <form action="/register"
              method="post">

            <input
                type="text"
                name="username"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">

                Create Account

            </button>

        </form>

        <p class="bottom-text">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </p>

    </div>

</body>

</html>
